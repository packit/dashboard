name: Rebuild & push images
on:
  push:
    branches:
      - main
      - stable

jobs:
  build-n-push:
    # To not run in forks
    if: github.repository_owner == 'packit'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile: [Dockerfile]
        image: [dashboard]
        # Include only configurations for the branch that triggered the workflow.
        # [TODO] Switch internal to `stable` once stabilized, duh…
        include:
          - branch: main
            deployment: stg
            tags: "stg latest"

          - branch: main
            deployment: internal
            tags: "internal"

          - branch: stable
            deployment: prod
            tags: "prod"

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3

      - name: Construct image tags and get commit SHA
        shell: bash
        env:
          BRANCH: ${{ matrix.branch }}
          TAGS: ${{ matrix.tags }}
        run: |
          UNIQUE_TAG="${BRANCH}-${GITHUB_SHA::7}"
          echo "tags=${TAGS} ${UNIQUE_TAG}" >> $GITHUB_OUTPUT

          echo "commit_sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        id: make_facts

      - name: Set up secret file needed for the build
        if: ${{ github.ref_name == matrix.branch }}
        run: echo "$SENTRY_AUTH_TOKEN" > /tmp/sentry-secret
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build Image
        if: ${{ github.ref_name == matrix.branch }}
        id: build-image
        # https://github.com/marketplace/actions/buildah-build
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2
        with:
          dockerfiles: ${{ matrix.dockerfile }}
          image: ${{ matrix.image }}
          tags: ${{ steps.make_facts.outputs.tags }}
          build-args: |
            DEPLOYMENT=${{ matrix.deployment }}
            VITE_API_URL=https://${{ matrix.deployment }}.packit.dev/api
            VITE_GIT_SHA=${{ steps.make_facts.outputs.commit_sha }}
          extra-args: |
            --secret id=sentry_auth_token,src=/tmp/sentry-secret
          oci: true

      - name: Push To Quay
        if: ${{ github.ref_name == matrix.branch }}
        # https://github.com/marketplace/actions/push-to-registry
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: quay.io/packit
          username: ${{ secrets.QUAY_IMAGE_BUILDER_USERNAME }}
          password: ${{ secrets.QUAY_IMAGE_BUILDER_TOKEN }}
